name: Release Windows Installer

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  check-version:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.check.outputs.version-changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check if version changed
        id: check
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Get the previous tag/commit version if it exists
          if git describe --abbrev=0 --tags 2>/dev/null; then
            PREV_TAG=$(git describe --abbrev=0 --tags)
            PREV_VERSION=$(git show $PREV_TAG:package.json | jq -r '.version' 2>/dev/null || echo "")
            if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
              echo "version-changed=true" >> $GITHUB_OUTPUT
            else
              echo "version-changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "version-changed=true" >> $GITHUB_OUTPUT
          fi

  publish-release:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts from CI
        uses: actions/download-artifact@v4
        with:
          name: tauri-installers
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.check-version.outputs.version }}
          tag_name: v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist/msi/*.msi
            dist/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

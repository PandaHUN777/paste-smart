name: Release Windows Installer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.check.outputs.version-changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if version changed
        id: check
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Get the previous tag/commit version if it exists
          if git describe --abbrev=0 --tags 2>/dev/null; then
            PREV_TAG=$(git describe --abbrev=0 --tags)
            PREV_VERSION=$(git show $PREV_TAG:package.json | jq -r '.version' 2>/dev/null || echo "")
            if [ "$CURRENT_VERSION" != "$PREV_VERSION" ]; then
              echo "version-changed=true" >> $GITHUB_OUTPUT
            else
              echo "version-changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "version-changed=true" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Validate release inputs
        shell: bash
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          RELEASE_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION=$(jq -r '.version' package.json)
          TAURI_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          CARGO_VERSION=$(awk -F '"' '/^version = / { print $2; exit }' src-tauri/Cargo.toml)

          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ] || [ "$RELEASE_VERSION" != "$TAURI_VERSION" ] || [ "$RELEASE_VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch:"
            echo "  workflow: $RELEASE_VERSION"
            echo "  package.json: $PACKAGE_VERSION"
            echo "  src-tauri/tauri.conf.json: $TAURI_VERSION"
            echo "  src-tauri/Cargo.toml: $CARGO_VERSION"
            exit 1
          fi

          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "TYPESAFE_API_KEY is not configured in repository secrets."
            exit 1
          fi

      - name: Cache Rust
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build Tauri app
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: bun run tauri build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.check-version.outputs.version }}
          tag_name: v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
